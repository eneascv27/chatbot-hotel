<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot - Reserva de hotel - Equipo 1</title>
<style>body{background:#FF69B4;font-family:Georgia,serif;margin:0;display:flex;justify-content:center}#c{max-width:560px;width:100%;padding:24px;box-sizing:border-box}#t{background:#fff;border-radius:12px;padding:20px;font-size:18px;line-height:1.5;white-space:pre-wrap}button,a{display:block;margin:10px 0 0;padding:12px;width:100%;font-size:16px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer;text-align:left}</style></head>
<body><div id="c"><div id="t"></div><div id="o"></div></div><script>
const D={"Inicio": {"t": "¡Hola! Soy Check-In, el asistente de reservaciones del Hotel Real Bajío.\n¿En qué te puedo ayudar hoy?", "o": [["Reservar habitación", "Habitacion"], ["Consultar tarifas", "Tarifas"], ["Servicios del hotel", "Servicios"]]}, "Tarifas": {"t": "Tarifas por noche: Sencilla $1,200 · Doble $1,800 · Suite $3,000 MXN.", "o": [["Hacer una reservación", "Habitacion"], ["Hablar con un humano", "Humano"], ["Volver al inicio", "Inicio"]]}, "Servicios": {"t": "Incluimos Wi-Fi, desayuno buffet, alberca y estacionamiento sin costo.", "o": [["Hacer una reservación", "Habitacion"], ["Hablar con un humano", "Humano"], ["Volver al inicio", "Inicio"]]}, "Habitacion": {"t": "Nivel 2. ¿Qué tipo de habitación prefieres?", "o": [["Sencilla", "Huespedes", "hab", "Sencilla"], ["Doble", "Huespedes", "hab", "Doble"], ["Suite", "Huespedes", "hab", "Suite"]]}, "Huespedes": {"t": "Nivel 3. ¿Cuántas personas se hospedan?", "o": [["1 o 2 personas", "Noches", "huesp", "1 o 2"], ["3 a 6 personas", "Noches", "huesp", "3 a 6"], ["Más de 6 personas", "Eventos"]]}, "Eventos": {"t": "Para grupos de más de 6 personas manejamos tarifas de grupo y salones para eventos. Un ejecutivo te cotiza.", "o": [["Hablar con un humano", "Humano"], ["Servicios del hotel", "Servicios"], ["Volver al inicio", "Inicio"]]}, "Noches": {"t": "Nivel 4. ¿Cuántas noches te quedas?", "o": [["1 a 2 noches", "Resumen", "noches", "1 a 2"], ["3 a 6 noches", "Resumen", "noches", "3 a 6"], ["7 noches o más", "Estancia"]]}, "Estancia": {"t": "Para estancias de 7 noches o más hay tarifa mensual especial; un asesor te la calcula.", "o": [["Hablar con un humano", "Humano"], ["Consultar tarifas", "Tarifas"], ["Volver al inicio", "Inicio"]]}, "Resumen": {"t": "Nivel 5. Tu reserva: habitación $hab, $huesp personas, $noches noches. ¿La confirmamos?", "o": [["Confirmar reserva", "Final"], ["Hablar con un humano", "Humano"], ["Cancelar y volver al inicio", "Inicio"]]}, "Final": {"t": "Reserva confirmada: habitación $hab para $huesp personas, $noches noches. Te llegará la confirmación por correo.\n\n[[Volver al inicio->Inicio]]\n¡Gracias por elegirnos, camarón!", "o": []}, "Humano": {"t": "Un asesor de recepción te atenderá en el 477 000 0000 (L–D, 8:00 a 22:00 h).", "o": [["Volver al inicio", "Inicio"], ["Servicios del hotel", "Servicios"], ["Consultar tarifas", "Tarifas"]]}, "Cocina secreta": {"t": "Pasaje sin enlaces de entrada.", "o": []}};let S={};
function go(k){const n=D[k];let x=n.t.replace(/\$(\w+)/g,(m,v)=>S[v]||m);
let f=x.match(/\n\n\[\[(.+?)->(.+?)\]\]\n([^\n]+)$/);
const t=document.getElementById("t"),o=document.getElementById("o");o.innerHTML="";
if(f){t.textContent=x.slice(0,f.index)+"\n\n"+f[3];const b=document.createElement("button");b.textContent=f[1];b.onclick=()=>go(f[2]);o.appendChild(b);return}
t.textContent=x;n.o.forEach(l=>{const b=document.createElement("button");b.textContent=l[0];b.onclick=()=>{if(l[2])S[l[2]]=l[3];go(l[1])};o.appendChild(b)})}
go("Inicio");</script></body></html>
